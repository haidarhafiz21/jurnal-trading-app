<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Jurnal Trading</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#101A2D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jurnal Trading">
<script>window.JT_PWA = true;</script>
<script src="vendor/ed25519-verify.js"></script>
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<script src="vendor/chart.umd.js"></script>
<style>
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-num:'Archivo','Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --card-shadow:0 1px 2px rgba(20,33,61,.05),0 4px 14px rgba(20,33,61,.05);
  --bg:#EEF1F6;--panel:#FFFFFF;--panel-2:#F4F6F9;--ink:#14213D;--ink-2:#45516A;--ink-3:#6F7A90;
  --line:#D5DBE4;--line-2:#E6E9EF;
  --band:#14213D;--band-2:#1C2C4E;--band-ink:#EEF2FA;--band-ink-2:#9DA9C3;--band-line:#2B3C60;
  --gold:#E3A23B;--gold-ink:#94620E;--gold-bg:#FBEFD9;--on-gold:#14213D;
  --bull:#0D8763;--bull-bg:#DDF1E8;--bear:#C5354C;--bear-bg:#F9E1E5;
  --focus:#2E6BD6;
  --shadow:0 2px 6px rgba(20,33,61,.08),0 18px 44px rgba(20,33,61,.16);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1320;--panel:#141D30;--panel-2:#19243A;--ink:#E6EBF4;--ink-2:#AAB4C8;--ink-3:#7D889F;
    --line:#26324B;--line-2:#1E293F;
    --band:#101A2D;--band-2:#16233C;--band-ink:#EEF2FA;--band-ink-2:#8E9AB4;--band-line:#24324F;
    --gold:#F0B24E;--gold-ink:#F0B24E;--gold-bg:#3A2E18;--on-gold:#14213D;
    --bull:#2FDB9F;--bull-bg:#0F3A2C;--bear:#FF6B81;--bear-bg:#43192A;
    --focus:#79A6FF;
    --shadow:0 2px 6px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1320;--panel:#141D30;--panel-2:#19243A;--ink:#E6EBF4;--ink-2:#AAB4C8;--ink-3:#7D889F;
  --line:#26324B;--line-2:#1E293F;
  --band:#101A2D;--band-2:#16233C;--band-ink:#EEF2FA;--band-ink-2:#8E9AB4;--band-line:#24324F;
  --gold:#F0B24E;--gold-ink:#F0B24E;--gold-bg:#3A2E18;--on-gold:#14213D;
  --bull:#2FDB9F;--bull-bg:#0F3A2C;--bear:#FF6B81;--bear-bg:#43192A;
  --focus:#79A6FF;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 18px 44px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
[hidden]{display:none!important}
img{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--bull)} .neg{color:var(--bear)} .muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-ink);border-bottom:1px solid var(--band-line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:720;font-stretch:118%;font-size:16px;letter-spacing:.01em;white-space:nowrap}
.brand svg{flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:8px 12px;border-radius:8px;color:var(--band-ink-2);text-decoration:none;white-space:nowrap;font-weight:560;font-size:14.5px;border-bottom:2px solid transparent;border-radius:6px 6px 0 0}
.tabs a:hover{color:var(--band-ink)}
.tabs a[aria-current="page"]{color:var(--band-ink);border-bottom-color:var(--gold)}
.top-add{flex:none}
.sync{font-size:12.5px;color:var(--band-ink-2);white-space:nowrap}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:620;font-size:14.5px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--bear);border-color:color-mix(in srgb,var(--bear) 45%,var(--line))}
.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.band .btn.ghost{color:var(--band-ink)}
.band .btn.ghost:hover{background:rgba(255,255,255,.08)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--ink-2);font-weight:580}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);min-height:40px}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.inp.err{border-color:var(--bear)}
.inp-pre{position:relative}
.inp-pre span{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px;pointer-events:none}
.inp-pre .inp{padding-right:38px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:620;color:var(--ink-2);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button.buy[aria-pressed="true"]{background:var(--bull);color:#fff}
.seg button.sell[aria-pressed="true"]{background:var(--bear);color:#fff}
.seg.full{display:flex}.seg.full button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;cursor:pointer;color:var(--ink-2);line-height:1.3}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip .x{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:inherit;font-size:15px;line-height:1}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:650;line-height:1.5;white-space:nowrap}
.b-buy{color:var(--bull);background:var(--bull-bg)} .b-sell{color:var(--bear);background:var(--bear-bg)}
.r-win{color:var(--bull);background:var(--bull-bg)} .r-loss{color:var(--bear);background:var(--bear-bg)}
.r-be{color:var(--ink-2);background:var(--panel-2)} .r-open{color:var(--gold-ink);background:var(--gold-bg)}

/* ---------- layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1,h2,h3{margin:0;line-height:1.2}
h2.t{font-size:17px;font-weight:720;font-stretch:116%;letter-spacing:.003em}
h3.t{font-size:15px;font-weight:700;font-stretch:112%}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vh h1{font-size:clamp(24px,3.6vw,32px);font-weight:760;font-stretch:120%;letter-spacing:-.005em}
.vh p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.g2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.g2,.g2e{grid-template-columns:minmax(0,1fr)}}
.stack>*+*{margin-top:18px}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.empty{padding:28px 6px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- hero (ringkasan) ---------- */
.band{background:var(--band);color:var(--band-ink)}
.hero{padding:22px 20px 26px}
.hero-in{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr);gap:28px;align-items:stretch}
.hero-label{font-size:14px;color:var(--band-ink-2)}
.hero-acct{font-size:13px;color:var(--band-ink-2);margin-top:2px}
.balance{font-size:clamp(42px,6.4vw,68px);font-weight:720;font-stretch:76%;line-height:1;letter-spacing:-.01em;margin:10px 0 14px}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.hchip{padding:4px 10px;border-radius:7px;background:rgba(255,255,255,.07);font-size:13.5px;font-weight:600;color:var(--band-ink)}
.hchip.pos{color:#5FE0B4}.hchip.neg{color:#FF8D9C}
.hero-meta{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.hero-meta dt{color:var(--band-ink-2)} .hero-meta dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.hero-chart{position:relative;min-height:250px}
.hero-chart .cap{position:absolute;right:0;top:-2px;font-size:12.5px;color:var(--band-ink-2)}
@media (max-width:820px){.hero-in{grid-template-columns:minmax(0,1fr);gap:16px}.hero-chart{min-height:210px}}
.onb{max-width:560px}
.onb h1{font-size:clamp(28px,4.6vw,40px);font-weight:760;font-stretch:118%;line-height:1.1;margin:0 0 10px}
.onb p{color:var(--band-ink-2);margin:0 0 18px;max-width:52ch}
.onb .inp{background:var(--band-2);border-color:var(--band-line);color:var(--band-ink)}
.onb .lbl{color:var(--band-ink-2)}

/* ---------- stats strip ---------- */
.strip{background:var(--panel);border-bottom:1px solid var(--line)}
.strip-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:14px 20px;border-right:1px solid var(--line-2);border-top:1px solid var(--line-2);min-width:0}
.stat:nth-child(4n){border-right:0}
.stat:nth-child(-n+4){border-top:0}
.stat .k{font-size:13px;color:var(--ink-3)}
.stat .v{font-size:24px;font-weight:680;font-stretch:84%;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){
  .strip-in{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:12px 16px}
  .stat .v{font-size:20px}
  .stat:nth-child(4n){border-right:1px solid var(--line-2)}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(-n+4){border-top:1px solid var(--line-2)}
  .stat:nth-child(-n+2){border-top:0}
}

/* ---------- month progress ---------- */
.mbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mbig .v{white-space:nowrap;font-size:34px;font-weight:720;font-stretch:80%;line-height:1.1}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line-2);margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 16px}
.kv div{background:var(--panel-2);border-radius:10px;padding:9px 12px}
.kv span{display:block;font-size:12.5px;color:var(--ink-3)}
.kv b{font-size:16px;font-weight:660;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.kv{gap:6px}.kv div{padding:8px 9px}.kv b{font-size:14px}}

/* ---------- trade list ---------- */
.tlist{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.trow{display:grid;grid-template-columns:104px minmax(110px,1fr) 62px minmax(120px,1.3fr) 72px 74px 112px 78px 88px;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line-2);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font-size:14.5px}
.trow:first-child{border-top:0}
.trow:hover{background:var(--panel-2)}
.trow.head{cursor:default;background:var(--panel-2);font-size:12.5px;color:var(--ink-3);font-weight:620;padding-top:9px;padding-bottom:9px}
.trow.head:hover{background:var(--panel-2)}
.c-pair{font-weight:680;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-setup{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-date{color:var(--ink-2)}
.c-pnl,.c-pct,.c-rr,.c-r{text-align:right;font-variant-numeric:tabular-nums}
.c-pnl{font-weight:660;white-space:nowrap}
.c-st{text-align:right}
.compact .trow{grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"pair dir st pnl" "date setup setup pct";gap:3px 8px;padding:11px 20px}
.compact .c-pair{grid-area:pair}.compact .c-dir{grid-area:dir}.compact .c-st{grid-area:st;text-align:left}.compact .c-pnl{grid-area:pnl}
.compact .c-date{grid-area:date;font-size:13px}.compact .c-setup{grid-area:setup;font-size:13px}.compact .c-pct{grid-area:pct;font-size:13px}
.compact .c-rr,.compact .c-r{display:none}
@media (max-width:760px){
  .trow{grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"pair dir st pnl" "date setup setup pct";gap:3px 8px;padding:11px 14px}
  .trow.head{display:none}
  .c-pair{grid-area:pair}.c-dir{grid-area:dir}.c-st{grid-area:st;text-align:left}.c-pnl{grid-area:pnl}
  .c-date{grid-area:date;font-size:13px}.c-setup{grid-area:setup;font-size:13px}.c-pct{grid-area:pct;font-size:13px}
  .c-rr,.c-r{display:none}
}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:760px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .q{grid-column:1/-1}}
.sumline{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin:0 0 12px}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- tables ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th{font-size:12.5px;color:var(--ink-3);font-weight:620;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left}
.tb tr.sel td{background:var(--gold-bg)}
.tb tbody tr{cursor:default}
.tb tbody tr.click{cursor:pointer}
.tb tbody tr.click:hover td{background:var(--panel-2)}
.tb tr.sel:hover td{background:var(--gold-bg)}
.minibar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:8px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.cal .dow{font-size:12.5px;color:var(--ink-3);font-weight:620;padding:0 4px 2px}
.day{min-height:78px;border:1px solid var(--line-2);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;background:var(--panel);text-align:left;cursor:default;font-size:13px;min-width:0}
.day.out{opacity:.35}
.day .dn{font-size:12px;color:var(--ink-3)}
.day .dp{font-weight:680;font-variant-numeric:tabular-nums;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .dc{font-size:11.5px;color:var(--ink-2)}
.day .dp.short{display:none}
.day.has{cursor:pointer}
.day.has:hover{border-color:var(--ink-3)}
.day.today .dn{color:var(--ink);font-weight:700}
.d-win{background:var(--bull-bg);border-color:transparent}
.d-loss{background:var(--bear-bg);border-color:transparent}
@supports (background:color-mix(in srgb,red 50%,white)){
  .d-win{background:color-mix(in srgb,var(--bull) calc(var(--a,.15)*100%),var(--panel))}
  .d-loss{background:color-mix(in srgb,var(--bear) calc(var(--a,.15)*100%),var(--panel))}
}
.wk{background:var(--panel-2);border-color:transparent}
.wk .dn{font-weight:620}
@media (max-width:760px){
  .cal{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .cal .wk,.cal .dow.wkh{display:none}
  .day{min-height:56px;padding:4px 5px;border-radius:7px}
  .day .dc{display:none}
  .day .dp{font-size:10.5px;letter-spacing:-.02em}
  .day .dp.full{display:none}
  .day .dp.short{display:block}
}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(9,14,27,.55);display:flex;justify-content:flex-end}
.ov.center{align-items:center;justify-content:center;padding:16px}
.sheet{width:min(780px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.narrow{width:min(560px,100%)}
.sh-head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.sh-head h2{font-size:18px;font-weight:740;font-stretch:116%;flex:1}
.sh-body{flex:1;overflow:auto;padding:20px;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--panel);border-top:1px solid var(--line)}
.dlg{background:var(--panel);border-radius:16px;padding:22px;width:min(460px,100%);box-shadow:var(--shadow);max-height:100%;overflow:auto}
.dlg.wide{width:min(640px,100%)}
.dlg h2{font-size:18px;font-weight:740;font-stretch:114%;margin-bottom:8px}
.dlg p{margin:0 0 16px;color:var(--ink-2)}
.x-btn{border:0;background:var(--panel-2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;color:var(--ink-2);flex:none}
.x-btn:hover{color:var(--ink)}
.fsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.fsec>h3{margin-bottom:12px}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}

.preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line-2);border-radius:12px;overflow:hidden;margin-top:14px;background:var(--panel-2)}

}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shot{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}

/* detail */
.dt-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.facts span{display:block;font-size:12px;color:var(--ink-3)}

.prose{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;line-height:1.55}
.dsec{margin-top:18px}
.dsec>.lbl{display:block;margin-bottom:4px}

/* pair picker */
.pp{position:relative}
.pp-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:360px;min-width:260px}

.pp-cats .chip{padding:4px 10px;font-size:12.5px;white-space:nowrap}
.pp-list{overflow:auto;padding:4px;overscroll-behavior:contain}
.pp-grp{font-size:12px;color:var(--ink-3);padding:8px 10px 3px;font-weight:620}
.pp-item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer}
.pp-item[aria-selected="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--gold)}
.pp-sym{font-weight:680;font-variant-numeric:tabular-nums}
.pp-name{color:var(--ink-3);font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-none{padding:12px 10px;color:var(--ink-3);font-size:13.5px}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:14px;font-weight:560;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{display:none;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;height:54px;padding:0 20px;border-radius:16px;border:0;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(20,33,61,.3);cursor:pointer}

.notice{background:var(--gold-bg);color:var(--ink);border-bottom:1px solid var(--line)}

.foot{max-width:1200px;margin:0 auto;padding:6px 20px 34px;color:var(--ink-3);font-size:13px}
.loading{padding:80px 20px;text-align:center;color:var(--ink-3)}
.tagline{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.calc-out{background:var(--band);color:var(--band-ink);border:1px solid var(--band-line);border-radius:14px;padding:18px 20px;margin-top:16px}

.calc-out dt{color:var(--band-ink-2)} .calc-out dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
details.spec{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}

/* =========================================================
   Tampilan profesional: ikon, kartu, header
   ========================================================= */

.x-btn{display:grid;place-items:center}
.x-btn .ic{width:18px;height:18px}

.top{background:color-mix(in srgb,var(--band) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}

.dbst{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--band-ink-2);white-space:nowrap;padding:5px 10px;border-radius:999px;border:1px solid var(--band-line)}

.panel{box-shadow:var(--card-shadow);border-color:var(--line-2)}

.fsec{box-shadow:var(--card-shadow);border-color:var(--line-2)}

.balance,.stat .v,.mbig .v,.dt-pnl,.calc-out .big,.kv b,.pv b{font-family:var(--font-num)}

/* kartu statistik */
.strip{background:transparent;border-bottom:0}

.stat{background:var(--panel);border:1px solid var(--line-2)!important;border-radius:14px;padding:14px 16px;box-shadow:var(--card-shadow);display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center}

.hero{background:radial-gradient(800px 380px at 85% -20%,rgba(240,178,78,.14),transparent 60%),radial-gradient(700px 400px at -10% 120%,rgba(54,196,149,.10),transparent 60%),var(--band)}
.hero-label{display:flex;align-items:center;gap:7px}
.hchip{display:inline-flex;align-items:center;gap:5px}
.hchip .ic{width:14px;height:14px}

.empty .e-ico{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--panel-2);color:var(--ink-3)}
.trow{transition:background .12s}
.chip{transition:border-color .12s,background .12s}
.btn{transition:filter .12s,border-color .12s,background .12s}
.btn.gold{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 8px rgba(227,162,59,.28)}
.fab{gap:8px}
.toast{display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.sec-pw{display:grid;gap:10px}
a.icon-btn{text-decoration:none}
.icon-btn[aria-current="page"]{color:var(--gold);border-color:var(--gold)}
.help-search{position:relative;margin-bottom:18px;max-width:620px}

.help-search .inp{padding-left:40px;min-height:48px;font-size:15.5px;box-shadow:var(--card-shadow)}
.help-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:760px){.help-steps{grid-template-columns:minmax(0,1fr)}}
.help-step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;box-shadow:var(--card-shadow);text-decoration:none;color:inherit;cursor:pointer;font:inherit}

.help-step span:last-child{font-size:13px;color:var(--ink-3)}
.help-g{margin-bottom:14px;padding-bottom:4px}
.help-g h2.t{margin-bottom:6px}
.faq{border-top:1px solid var(--line-2)}
.faq:first-of-type{border-top:0}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;font-weight:600}

.faq summary:hover{color:var(--gold-ink)}

.help-contact{display:flex;gap:14px;align-items:center}
.notice-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gate .top,.gate .fab,.gate #foot,.gate #notice{display:none!important}

.gate-card{width:min(440px,100%);padding:26px 22px}

.gate-logo{width:48px;height:48px;border-radius:11px;overflow:hidden}.gate-logo svg{width:48px;height:48px;display:block;border-radius:12px}
.gate-id{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;margin-bottom:16px}

/* =========================================================
   v2.4: warna lebih terang, logo baru, animasi
   ========================================================= */

@keyframes jt-grow{from{transform:scaleY(0);opacity:0}}
@keyframes jt-shine{0%,72%{transform:translateX(-120%) skewX(-20deg)}100%{transform:translateX(220%) skewX(-20deg)}}
.lmark{position:relative;overflow:hidden;display:block;flex:none}
.lmark svg{display:block}
.lmark .lc{transform-box:fill-box;transform-origin:50% 100%;animation:jt-grow .6s cubic-bezier(.2,.8,.2,1) both}
.lmark .c1{animation-delay:.1s}.lmark .c2{animation-delay:.24s}
.brand-mark{width:34px;height:34px;border-radius:8px;box-shadow:none}
.brand-mark svg{width:34px;height:34px}
@media (max-width:860px){.brand-mark,.brand-mark svg{width:32px;height:32px}}
.brand{gap:11px}
.brand>span:last-child{font-size:16px;font-weight:650;letter-spacing:-.015em}
.brand small{font:500 10.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--band-ink-2);margin-top:2px}
.brand span:first-of-type{letter-spacing:-.01em}

/* --- kartu & panel --- */
.panel,.stat,.tlist,.fsec,.help-step{background-image:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 140px)}
.stat{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,border-color .22s}
.stat .si{transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.2);border-color:color-mix(in srgb,var(--gold) 45%,var(--line-2))!important}
.stat:hover .si{transform:scale(1.1) rotate(-6deg)}
.help-step{transition:transform .2s,border-color .2s,box-shadow .2s}
.help-step:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.16)}
.trow{position:relative}
.trow:not(.head):hover{box-shadow:inset 3px 0 0 var(--gold)}
.sumline b.pos{color:var(--bull)}.sumline b.neg{color:var(--bear)}

/* --- tombol --- */
.btn{transition:transform .12s,filter .12s,border-color .15s,background .15s,box-shadow .15s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.gold{position:relative;overflow:hidden;background:linear-gradient(180deg,#F8CB72,#E3A23B);border-color:#E3A23B}
.btn.gold::after,.fab::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-150%) skewX(-20deg);pointer-events:none}
.btn.gold:hover::after{animation:jt-sheen .8s ease}

function num(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).trim().replace(/\s/g, '').replace(/[^0-9.,\-+]/g, '');
  if (!s) return null;
  const hasC = s.includes(','), hasD = s.includes('.');
  if (hasC && hasD) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (hasC) {
    s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
  } else if (hasD && s.match(/\./g).length > 1) {
    s = s.replace(/\./g, '');
  }
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}

function searchInstr(q, cat){
  const qq = normSym(q).toLowerCase();

  let list = INSTR.filter(o => cat === 'Semua' || CAT_GROUP(o.cat) === cat);
  if (!qq) return list;
  const scored = [];
  list.forEach((o, i) => {
    const s = o.s.toLowerCase();
    let sc = -1;
    if (s === qq) sc = 0;
    else if (s.startsWith(qq)) sc = 1;
    else if (s.includes(qq)) sc = 2;
    else if (o.al.split(' ').some(w => w && (w.startsWith(raw) || w === qq))) sc = 3;
    else if (o.al.includes(raw) || o.n.toLowerCase().includes(raw)) sc = 4;
    if (sc >= 0) scored.push([sc, i, o]);
  });
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return scored.map(x => x[2]);
}

const IDB = {
  _db: null,
  open(){
    return this._db || (this._db = new Promise((res, rej) => {
      const r = indexedDB.open('jurnal-trading', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('trades', {keyPath: 'id'}); d.createObjectStore('images'); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    }));
  },
  async run(store, mode, fn){
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store);
      let out; const rq = fn(s);
      if (rq && 'onsuccess' in rq) rq.onsuccess = () => { out = rq.result; };
      t.oncomplete = () => res(out);
      t.onerror = t.onabort = () => rej(t.error || new Error('IndexedDB'));
    });
  },
  get(st, k){ return this.run(st, 'readonly', s => s.get(k)); },
  put(st, v, k){ return this.run(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  del(st, k){ return this.run(st, 'readwrite', s => s.delete(k)); },
  all(st){ return this.run(st, 'readonly', s => s.getAll()); },
  keys(st){ return this.run(st, 'readonly', s => s.getAllKeys()); },
  clear(st){ return this.run(st, 'readwrite', s => s.clear()); },
  putMany(st, arr){ return this.run(st, 'readwrite', s => { arr.forEach(v => s.put(v)); }); },
  delMany(st, keys){ return this.run(st, 'readwrite', s => { keys.forEach(k => s.delete(k)); }); }
};

const LIC_PUB = 'MCowBQYDK2VwAyEA8kOwNdU7mnN3N5zynklyLvIsc/wAMt8irw5GKptk6Ag=';
function b64d(s){ s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function checkKeyPhone(key, dev){
  const k = String(key || '').replace(/\s+/g, '');
  const m = k.match(/^JT1-([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
  if (!m) return {ok: false, error: 'Format kunci lisensi tidak dikenali. Pastikan disalin utuh dari JT1- sampai akhir.'};
  if (typeof window.edVerify !== 'function') return {ok: false, error: 'Komponen verifikasi gagal dimuat. Muat ulang halaman.'};
  let ok = false;
  try { ok = await window.edVerify(new TextEncoder().encode(m[1]), b64d(m[2]), b64d(LIC_PUB).slice(-32)); } catch (e) {}
  if (!ok) return {ok: false, error: 'Kunci lisensi tidak valid.'};
  let p; try { p = JSON.parse(new TextDecoder().decode(b64d(m[1]))); } catch (e) { return {ok: false, error: 'Kunci lisensi tidak valid.'}; }
  if (p.m && p.m !== dev) return {ok: false, error: 'Kunci ini terdaftar untuk perangkat lain (ID ' + p.m + '). Chat TikTok penjual dengan ID perangkat ini.'};
  if (p.x && Date.now() > p.x) return {ok: false, error: 'Kunci lisensi sudah kedaluwarsa.'};
  return {ok: true, payload: p};
}
async function phoneDevice(){
  let id = null;
  try { id = await IDB.get('kv', 'device'); } catch (e) {}
  if (!id) { try { id = localStorage.getItem('jt-device'); } catch (e) {} }
  if (!id || !/^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/.test(id)) {
    const b = crypto.getRandomValues(new Uint8Array(8));
    id = Array.from(b, x => x.toString(16).padStart(2, '0')).join('').toUpperCase().match(/.{4}/g).join('-');
  }
  try { await IDB.put('kv', id, 'device'); } catch (e) {}
  try { localStorage.setItem('jt-device', id); } catch (e) {}
  return id;
}

async function api(method, url, body, raw){

  S.busy++; renderDb();
  let r;

  finally { S.busy--; renderDb(); }
  if (S.offline) { S.offline = false; renderChrome(); }
  if (r.status === 401) { location.href = '/login.html'; throw {code: 'unauthorized'}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code: r.status, message: j.error};
  return j;
}

function deriv(t){
  const e = t.entry, sl = t.sl, tp = t.tp, x = t.exit;
  const dir = t.dir === 'sell' ? -1 : 1;
  const slD = (e != null && sl != null && e !== sl) ? Math.abs(e - sl) : null;
  const tpD = (e != null && tp != null) ? Math.abs(tp - e) : null;
  const rr = (slD && tpD != null) ? tpD / slD : null;
  const closed = t.status === 'closed';
  let r = null;
  if (closed) {
    if (slD && x != null && e != null) r = (x - e) * dir / slD;
    else if (t.riskAmt > 0 && t.pnl != null) r = t.pnl / t.riskAmt;
  }
  const pnl = closed ? (t.pnl == null ? 0 : t.pnl) : null;
  const res = !closed ? 'open' : pnl > 0 ? 'win' : pnl < 0 ? 'loss' : 'be';
  const sp = spec(t.pair);
  return {slD, tpD, rr, r, pnl, res, sp, slPip: sp.pip && slD != null ? slD / sp.pip : null, tpPip: sp.pip && tpD != null ? tpD / sp.pip : null};
}
function tradeDate(t){ return (t.status === 'closed' ? (t.closeDate || t.openDate) : t.openDate) || ''; }
function statsOf(rows){
  const st = {n: rows.length, w: 0, l: 0, be: 0, pnl: 0, gp: 0, gl: 0, rrSum: 0, rrN: 0, rSum: 0, rN: 0, best: null, worst: null};
  rows.forEach(x => {
    const d = x.d;
    if (d.res === 'win') { st.w++; st.gp += d.pnl; } else if (d.res === 'loss') { st.l++; st.gl += d.pnl; } else st.be++;
    st.pnl += d.pnl;
    if (d.rr != null) { st.rrSum += d.rr; st.rrN++; }
    if (d.r != null) { st.rSum += d.r; st.rN++; }
    if (!st.best || d.pnl > st.best.d.pnl) st.best = x;
    if (!st.worst || d.pnl < st.worst.d.pnl) st.worst = x;
  });
  st.wr = (st.w + st.l) ? st.w / (st.w + st.l) * 100 : null;
  st.pf = st.gl < 0 ? st.gp / -st.gl : (st.gp > 0 ? Infinity : null);
  st.avgRR = st.rrN ? st.rrSum / st.rrN : null;
  st.avgR = st.rN ? st.rSum / st.rN : null;
  st.exp = st.n ? st.pnl / st.n : null;
  st.avgWin = st.w ? st.gp / st.w : null;
  st.avgLoss = st.l ? st.gl / st.l : null;
  return st;
}
let _L = null, _Lsrc = null;
function ledger(){
  const data = D();
  const key = data.trades.length + '|' + data.trades.reduce((a, t) => a + (t.updatedAt || 0), 0) + '|' + JSON.stringify(data.settings) + '|' + (S.demo ? 1 : S.real.settings.active);
  if (_L && _Lsrc === key) return _L;
  const st = data.settings;
  const rows = new Map();
  const closed = [], open = [];
  data.trades.forEach(t => {
    const x = {t, d: deriv(t), balBefore: null, balAfter: null, pct: null};
    rows.set(t.id, x);
    (t.status === 'closed' ? closed : open).push(x);
  });
  const ord = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const ev = [];
  (st.flows || []).forEach(f => ev.push({k: 'flow', date: f.date || '', f, o: 0, tm: '', c: f.createdAt || 0}));
  closed.forEach(x => ev.push({k: 'trade', date: x.t.closeDate || x.t.openDate || '', x, o: 1, tm: x.t.closeTime || x.t.openTime || '', c: x.t.createdAt || 0}));
  ev.sort((a, b) => ord(a.date, b.date) || a.o - b.o || ord(a.tm, b.tm) || a.c - b.c);
  const initial = st.initial || 0;
  let bal = initial, idx = 1, peak = 1, maxDD = 0, flowsNet = 0;
  const sd0 = st.startDate || today();
  const startDate = (ev[0] && ev[0].date && ev[0].date < sd0) ? ev[0].date : sd0;
  const equity = [{date: startDate, bal, tip: 'Saldo awal', lab: fmtDateS(startDate)}];
  const months = {};
  const days = {};
  const chron = [];
  ev.forEach(e => {
    const k = (e.date || startDate).slice(0, 7);
    if (!months[k]) months[k] = {k, startBal: bal, endBal: bal, n: 0, w: 0, l: 0, be: 0, pnl: 0, g: 1, flows: 0, gp: 0, gl: 0, rSum: 0, rN: 0};
    const m = months[k];
    if (e.k === 'flow') {
      const amt = (e.f.type === 'wd' ? -1 : 1) * (e.f.amount || 0);
      bal += amt; flowsNet += amt; m.flows += amt;
      equity.push({date: e.date, bal, tip: (amt >= 0 ? 'Deposit ' : 'Penarikan ') + fmtMoney(Math.abs(amt)), lab: fmtDateS(e.date)});
    } else {
      const x = e.x, p = x.d.pnl;
      x.balBefore = bal; x.pct = bal > 0 ? p / bal * 100 : null;
      bal += p; x.balAfter = bal;
      if (x.pct != null) idx *= (1 + x.pct / 100);
      peak = Math.max(peak, idx); maxDD = Math.max(maxDD, (peak - idx) / peak * 100);
      m.n++; m.pnl += p; if (x.pct != null) m.g *= (1 + x.pct / 100);
      if (x.d.res === 'win') { m.w++; m.gp += p; } else if (x.d.res === 'loss') { m.l++; m.gl += p; } else m.be++;
      if (x.d.r != null) { m.rSum += x.d.r; m.rN++; }
      const dd = e.date;
      if (dd) { const dy = days[dd] || (days[dd] = {pnl: 0, n: 0, w: 0, l: 0}); dy.pnl += p; dy.n++; if (x.d.res === 'win') dy.w++; else if (x.d.res === 'loss') dy.l++; }
      equity.push({date: e.date, bal, tip: x.t.pair + ' ' + (x.t.dir === 'sell' ? 'Sell' : 'Buy') + ' ' + fmtMoney(p, true), lab: fmtDateS(e.date)});
      chron.push(x);
    }
    m.endBal = bal;
  });
  // isi bulan yang kosong
  const keys = Object.keys(months).sort();
  const mlist = [];
  if (keys.length) {
    const last = keys[keys.length - 1] > today().slice(0, 7) ? keys[keys.length - 1] : today().slice(0, 7);
    let k = keys[0], prev = null;
    while (k <= last) {
      const m = months[k] || {k, startBal: prev ? prev.endBal : initial, endBal: prev ? prev.endBal : initial, n: 0, w: 0, l: 0, be: 0, pnl: 0, g: 1, flows: 0, gp: 0, gl: 0, rSum: 0, rN: 0};
      m.ret = (m.g - 1) * 100;
      mlist.push(m); prev = m; k = addMonth(k, 1);
      if (mlist.length > 600) break;
    }
  }
  // streak
  let cur = 0, curType = null, maxW = 0, maxL = 0, runW = 0, runL = 0;
  chron.forEach(x => {
    if (x.d.res === 'win') { runW++; runL = 0; } else if (x.d.res === 'loss') { runL++; runW = 0; }
    maxW = Math.max(maxW, runW); maxL = Math.max(maxL, runL);
  });
  for (let i = chron.length - 1; i >= 0; i--) {
    const r = chron[i].d.res; if (r === 'be') continue;
    if (!curType) { curType = r; cur = 1; } else if (r === curType) cur++; else break;
  }
  const stats = statsOf(chron);
  _L = {rows, closed: chron, open, equity, months: mlist, monthMap: Object.fromEntries(mlist.map(m => [m.k, m])), days, stats,
    balance: bal, initial, flowsNet, ret: (idx - 1) * 100, maxDD, streak: {cur, curType, maxW, maxL}};
  _Lsrc = key;
  return _L;
}

function groupKeys(x, by){
  const t = x.t;
  switch (by) {
    case 'pair': return [t.pair || '—'];
    case 'setup': return [t.setup || 'Tanpa setup'];
    case 'session': return [t.session || 'Tidak diisi'];
    case 'dow': return [t.openDate ? DOW[parseD(t.openDate).getDay()] : '—'];
    case 'tf': return [t.tf || 'Tidak diisi'];
    case 'dir': return [t.dir === 'sell' ? 'Sell' : 'Buy'];
    case 'tags': return (t.tags && t.tags.length) ? t.tags : ['Tanpa konfluensi'];
    case 'emotion': return [t.emotion || 'Tidak diisi'];
    case 'followed': return [t.followed === 'ya' ? 'Sesuai rencana' : t.followed === 'tidak' ? 'Tidak sesuai rencana' : 'Tidak diisi'];
  }
  return ['—'];
}
function groupStats(rows, by){
  const g = {};
  rows.forEach(x => groupKeys(x, by).forEach(k => (g[k] = g[k] || []).push(x)));
  let out = Object.keys(g).map(k => Object.assign({k}, statsOf(g[k])));
  if (by === 'dow') { const ord = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu']; out.sort((a, b) => ord.indexOf(a.k) - ord.indexOf(b.k)); }
  else if (by === 'tf') out.sort((a, b) => TFS.indexOf(a.k) - TFS.indexOf(b.k));
  else out.sort((a, b) => b.pnl - a.pnl);
  return out;
}

  if (e === sl) { out.innerHTML = '<div class="hero-label">Lot yang disarankan</div><div class="big">—</div><p style="margin:0;color:var(--band-ink-2)">Stop loss tidak boleh sama dengan harga entry.</p>'; return; }
  if (q == null) { out.innerHTML = '<div class="hero-label">Lot yang disarankan</div><div class="big">—</div><p style="margin:0;color:var(--band-ink-2)">Isi ' + esc(need ? need.label.toLowerCase() : 'kurs konversi') + ' untuk menghitung lot.</p>'; return; }
  const riskAmt = bal * risk / 100;
  const slD = Math.abs(e - sl);
  const perLot = slD * cs * q * fx;
  const lot = riskAmt / perLot;
  const lotR = Math.max(0.01, Math.floor(lot * 100 + 1e-9) / 100);
  const actual = lotR * perLot;
  const pipVal = pip ? pip * cs * q * fx : null;
  const dir = sl < e ? 1 : -1;
  const tpOk = tp != null && (tp - e) * dir > 0;
  const rr = tpOk ? Math.abs(tp - e) / slD : null;
  const prof = tpOk ? Math.abs(tp - e) * cs * q * fx * lotR : null;
  out.innerHTML = '<div class="hero-label">Lot yang disarankan (' + (dir > 0 ? 'Buy' : 'Sell') + ')</div><div class="big">' + fmtN(lotR, 2) + ' lot</div>' +
    (lot < 0.01 ? '<p style="margin:0 0 12px;color:#FFB4BF">Risiko Anda lebih kecil dari lot minimal 0,01. Dengan 0,01 lot risikonya ' + fmtMoney(actual) + ' (' + fmtPct(actual / bal * 100, false) + ').</p>' : '') +
    '<dl><dt>Risiko yang diinginkan</dt><dd>' + fmtMoney(riskAmt) + '</dd>' +
    '<dt>Jarak stop loss</dt><dd>' + (pip ? fmtN(slD / pip, 1) + ' pip' : fmtN(slD, slD < 1 ? 5 : 2) + ' poin') + '</dd>' +
    (pipVal ? '<dt>Nilai 1 pip per 1 lot</dt><dd>' + fmtMoney(pipVal) + '</dd>' : '') +
    '<dt>Risiko aktual dengan ' + fmtN(lotR, 2) + ' lot</dt><dd>' + fmtMoney(actual) + ' (' + fmtPct(actual / bal * 100, false) + ')</dd>' +
    (rr != null ? '<dt>Risk reward</dt><dd>' + fmtRR(rr) + '</dd><dt>Potensi profit di TP</dt><dd>' + fmtMoney(prof, true) + ' (' + fmtPct(prof / bal * 100) + ')</dd>' : '') +
    '</dl>' + (tp != null && !tpOk ? '<p style="margin:12px 0 0;color:#FFB4BF">Take profit berada di sisi yang salah dari entry.</p>' : '');
}
function calcCG(){
  const g = S.calc.cg, cur = D().settings.currency;
  const start = moneyFor(cur, g.start), pct = num(g.pct), mo = clamp(Math.round(num(g.months) || 0), 0, 120), add = moneyFor(cur, g.add) || 0;
  const out = $('#g-out');
  if (!(start > 0) || pct == null || !mo) { out.innerHTML = '<p class="hint" style="margin-top:14px">Isi modal, return per bulan, dan jumlah bulan.</p>'; return; }
  let bal = start, k = today().slice(0, 7), totalProfit = 0, totalAdd = 0;
  const rows = [];
  for (let i = 1; i <= mo; i++) { const p = bal * pct / 100; bal += p + add; totalProfit += p; totalAdd += add; k = addMonth(k, 1); rows.push([i, k, p, bal]); }
  out.innerHTML = '<div class="calc-out"><div class="hero-label">Saldo setelah ' + mo + ' bulan</div><div class="big">' + fmtMoney(bal) + '</div><dl>' +
    '<dt>Total profit</dt><dd>' + fmtMoney(totalProfit, true) + '</dd>' + (totalAdd ? '<dt>Total tambahan dana</dt><dd>' + fmtMoney(totalAdd, true) + '</dd>' : '') +
    '<dt>Pertumbuhan dari profit</dt><dd>' + fmtPct(totalProfit / start * 100) + '</dd></dl></div>' +
    '<div class="scroll-x" style="max-height:320px;overflow-y:auto;margin-top:14px"><table class="tb"><thead><tr><th>Bulan</th><th>Profit</th><th>Saldo</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td>' + r[0] + '. ' + monthLabel(r[1], true) + '</td><td class="pos">' + fmtMoney(r[2], true) + '</td><td>' + fmtMoney(r[3]) + '</td></tr>').join('') + '</tbody></table></div>' +
    '<p class="hint" style="margin:10px 0 0">Proyeksi ini hanya simulasi matematis. Hasil trading nyata naik turun dan tidak dijamin.</p>';
}

/* =========================================================
   Lapisan: sheet, dialog, toast
   ========================================================= */
const layers = [];
function openLayer(html, opt){
  opt = opt || {};
  const ov = document.createElement('div');
  ov.className = opt.cls || 'ov';
  ov.innerHTML = html;
  $('#layers').appendChild(ov);
  const prev = document.activeElement;
  const layer = {ov, closed: false, beforeClose: null,
    close(){ if (layer.closed) return; layer.closed = true; ov.remove(); const i = layers.indexOf(layer); if (i >= 0) layers.splice(i, 1); document.body.style.overflow = layers.length ? 'hidden' : ''; if (opt.onClose) opt.onClose(); if (prev && prev.focus && document.contains(prev)) prev.focus(); },
    async request(){ if (layer.beforeClose && !(await layer.beforeClose())) return; layer.close(); }};
  layers.push(layer);
  document.body.style.overflow = 'hidden';
  let down = false;
  ov.addEventListener('pointerdown', e => { down = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && down) layer.request(); down = false; });
  $$('[data-close]', ov).forEach(b => b.addEventListener('click', () => layer.request()));
  return layer;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layers.length) { e.preventDefault(); layers[layers.length - 1].request(); } });
function confirmBox(title, msg, okLabel, danger){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const l = openLayer('<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="cb-t" aria-describedby="cb-m"><h2 id="cb-t">' + esc(title) + '</h2><p id="cb-m">' + esc(msg) + '</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close>Batal</button><button class="btn ' + (danger ? 'danger' : 'gold') + '" type="button" id="cb-ok">' + esc(okLabel) + '</button></div></div>', {cls: 'ov center', onClose: () => fin(false)});
    $('#cb-ok', l.ov).addEventListener('click', () => { fin(true); l.close(); });
    $('#cb-ok', l.ov).focus();
  });
}
let toastT;
function toast(msg, kind){
  const t = $('#toast');
  kind = kind || (/gagal|tidak bisa|tidak valid|salah|offline|penuh/i.test(msg) ? 'bad' : 'ok');
  t.className = 'toast ' + kind;
  t.innerHTML = '<span class="t-ic">' + ic(kind === 'bad' ? 'alert' : kind === 'win' ? 'up' : 'ok') + '</span><span>' + esc(msg) + '</span>';
  void t.offsetWidth; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), kind === 'win' ? 3800 : 3000);
}

function pickerHTML(id, val){
  return '<div class="pp"><input class="inp" id="' + id + '" autocomplete="off" autocapitalize="characters" spellcheck="false" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="' + id + '-list" placeholder="Cari: XAUUSD, emas, EURUSD, nasdaq, bitcoin…" value="' + esc(val || '') + '">' +
    '<div class="pp-panel" hidden><div class="pp-cats" role="group" aria-label="Kategori instrumen"></div><div class="pp-list" role="listbox" id="' + id + '-list" aria-label="Daftar instrumen"></div></div></div>';
}
function attachPicker(input, onPick){
  const wrap = input.closest('.pp'), panel = $('.pp-panel', wrap), cats = $('.pp-cats', wrap), listEl = $('.pp-list', wrap);
  let cat = 'Semua', items = [], act = 0, typed = false, isOpen = false;
  const drawCats = () => { cats.innerHTML = PICK_CATS.map(c => '<button type="button" class="chip" data-c="' + c + '" aria-pressed="' + (c === cat) + '">' + c + '</button>').join(''); };
  const recent = () => { const f = {}; D().trades.forEach(t => { if (t.pair) f[t.pair] = (f[t.pair] || 0) + 1; }); return Object.keys(f).sort((a, b) => f[b] - f[a]).slice(0, 6); };
  function draw(){
    const q = typed ? input.value.trim() : '';
    let html = ''; items = [];
    const item = (o, i) => '<div class="pp-item" role="option" id="' + input.id + '-o' + i + '" data-i="' + i + '" aria-selected="' + (i === act) + '"><span class="pp-sym">' + esc(o.s) + '</span><span class="pp-name">' + esc(o.custom ? 'Pakai sebagai simbol kustom' : o.n) + '</span></div>';
    const section = (title, arr) => { if (!arr.length) return; html += '<div class="pp-grp">' + esc(title) + '</div>'; arr.forEach(o => { html += item(o, items.length); items.push(o); }); };
    if (q) {
      const res = searchInstr(q, cat);
      res.forEach(o => { html += item(o, items.length); items.push(o); });
      const ns = normSym(q);
      if (ns.length >= 2 && !INS[ns]) { const o = {s: ns, custom: true}; html += item(o, items.length); items.push(o); }
      if (!res.length && !(ns.length >= 2)) html += '<div class="pp-none">Tidak ada yang cocok.</div>';
    } else {
      if (cat === 'Semua') {
        const rec = recent();
        section('Sering Anda pakai', rec.map(s => spec(s)));
        section('Populer', POPULAR.filter(s => !rec.includes(s)).map(s => INS[s]));
      }
      const groups = {};
      INSTR.filter(o => cat === 'Semua' || CAT_GROUP(o.cat) === cat).forEach(o => (groups[o.cat] = groups[o.cat] || []).push(o));
      Object.keys(groups).forEach(g => section(g, groups[g]));
    }
    if (act >= items.length) act = Math.max(0, items.length - 1);
    listEl.innerHTML = html;
    input.setAttribute('aria-activedescendant', items.length ? input.id + '-o' + act : '');
  }
  function open(){ if (isOpen) return; isOpen = true; panel.hidden = false; input.setAttribute('aria-expanded', 'true'); drawCats(); draw(); }
  function close(){ if (!isOpen) return; isOpen = false; panel.hidden = true; input.setAttribute('aria-expanded', 'false'); }
  function pick(i){ const o = items[i]; if (!o) return; input.value = o.s; typed = false; close(); onPick && onPick(o.s); }
  function commit(){ if (typed) { typed = false; const ns = normSym(input.value); input.value = ns; onPick && onPick(ns); } }
  function setAct(n){
    act = clamp(n, 0, items.length - 1);
    $$('.pp-item', listEl).forEach(el => el.setAttribute('aria-selected', String(+el.dataset.i === act)));
    const el = $('#' + input.id + '-o' + act, listEl); if (el) el.scrollIntoView({block: 'nearest'});
    input.setAttribute('aria-activedescendant', input.id + '-o' + act);
  }
  input.addEventListener('focus', () => { typed = false; act = 0; open(); try { input.select(); } catch (e) {} });
  input.addEventListener('click', () => open());
  input.addEventListener('input', () => { typed = true; act = 0; if (!isOpen) open(); else draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!isOpen) open(); else setAct(act + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setAct(act - 1); }
    else if (e.key === 'Enter') { if (isOpen && items.length) { e.preventDefault(); pick(act); } }
    else if (e.key === 'Escape') { if (isOpen) { e.preventDefault(); e.stopPropagation(); close(); } }
    else if (e.key === 'Tab') { if (isOpen && typed && items.length && items[act] && !items[act].custom) pick(act); else { commit(); close(); } }
  });
  cats.addEventListener('pointerdown', e => e.preventDefault());
  cats.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; cat = b.dataset.c; act = 0; drawCats(); draw(); listEl.scrollTop = 0; });
  listEl.addEventListener('pointerdown', e => e.preventDefault());
  listEl.addEventListener('click', e => { const it = e.target.closest('.pp-item'); if (it) pick(+it.dataset.i); });
  input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== input) { commit(); close(); } }, 120));
}

  R.addEventListener('paste', e => {

  const nums = () => ({e: num(v('f-entry')), sl: num(v('f-sl')), tp: num(v('f-tp')), x: num(v('f-exit')), lot: num(v('f-lot')), rp: num(v('f-rp')), ra: moneyFor(cur, v('f-ra'))});
  function dist(p, pips){ return pips != null ? fmtN(pips, 1) + ' pip' : p != null ? fmtN(p, p < 1 ? 5 : 2) + ' poin' : '—'; }
  function update(){

      emotion: emo, followed: fo, notes: v('f-notes').trim(), link: /^https?:\/\//i.test(link) ? link : (link ? 'https://' + link : ''),
      shot: shot && shot.id ? {id: shot.id} : null,

    const btn = g('f-save'); btn.disabled = true;
    const ok = await Store.saveTrade(out);

    const s2 = clean(D().settings); let ch = false;

async function deleteTrade(t){
  if (!await confirmBox('Hapus trade ' + t.pair + '?', 'Trade ini akan dihapus permanen dan statistik dihitung ulang.', 'Hapus trade', true)) return false;
  const ok = await Store.deleteTrade(t.id);
  if (ok) { if (t.shot && t.shot.id && !S.demo) Store.deleteImage(t.shot.id); toast('Trade dihapus.'); }
  return ok;
}
async function shrink(file){
  try {
    if (!file.type || !file.type.startsWith('image/') || file.type === 'image/svg+xml' || file.type === 'image/gif') return file;
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    if (sc === 1 && file.size < 1.5e6) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.86));
  } catch (e) { return file; }
}

function parseCSV(text, delim){

function parseImport(text){

  const act = a.dataset.act;
  if (act === 'add') openForm();
  else if (act === 'accounts') openAccounts();
  else if (act === 'new-account') openNewAccount();
  else if (act === 'demo') enterDemo();
  else if (act === 'exit-demo') exitDemo();
  else if (act === 'reload') Store.reload();
  else if (act === 'backup') backupNow();
  else if (act === 'backup-later') { try { localStorage.setItem('jt-backup-snooze', String(Date.now() + 3 * 864e5)); } catch (e) {} renderChrome(); }
  else if (act === 'logout') logout();
});
async function logout(){ try { await api('POST', '/api/logout'); } catch (e) {} location.href = '/login.html'; }
$('#btnLogout').addEventListener('click', logout);
$('#btnAdd').addEventListener('click', () => openForm());
$('#fab').addEventListener('click', () => openForm());
window.addEventListener('hashchange', route);
if (window.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); const fn = () => render(); if (mq.addEventListener) mq.addEventListener('change', fn); else if (mq.addListener) mq.addListener(fn); }
new MutationObserver(() => render()).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
route();
Store.init();
})();
</script>
<script>
// Pembaruan otomatis: cek versi baru setiap aplikasi dibuka/kembali ke depan,
// lalu muat ulang begitu versi baru aktif (ditunda jika formulir sedang terbuka).
if ('serviceWorker' in navigator) window.addEventListener('load', () => {
  const had = !!navigator.serviceWorker.controller;
  let pending = false, done = false;
  const busy = () => !!document.querySelector('#layers > *');
  const apply = () => { if (done) return; if (busy()) { pending = true; return; } done = true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) apply(); });
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
      else if (pending) { done = true; location.reload(); }
    });
    setInterval(() => { if (pending && !busy()) apply(); }, 3000);
  }).catch(() => {});
});
</script>
